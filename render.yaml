services:
  - type: web
    name: policygen-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: /data
      - key: STORAGE_BACKEND
        value: supabase
      - key: DATABASE_SCHEMA
        value: policygen
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://wzyiupxywkwrzqrbabom.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: policygen-files
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: JOB_WORKERS
        value: "1"

  - type: web
    name: policygen-workspace
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://policygen-ai.onrender.com/api
      - key: VITE_ROUTER_MODE
        value: hash
