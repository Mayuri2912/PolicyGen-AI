[pytest]
testpaths = tests
# Live tests call a real LLM API (cost, and data leaves the machine), so they
# only run when asked for:  pytest -m live
addopts = -q -ra -m "not live"
markers =
    live: calls a real LLM API (needs ANTHROPIC_API_KEY or GEMINI_API_KEY; run with: pytest -m live)
filterwarnings =
    ignore::DeprecationWarning
